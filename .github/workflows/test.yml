name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Skip install scripts: the unit tests need neither Electron nor the
      # native audio driver.
      - run: npm ci --ignore-scripts
      - run: npm test
